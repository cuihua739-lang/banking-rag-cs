<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>银行智能客服</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="chat-header">
      <div class="header-left">
        <div class="bank-logo">&#x1F3E6;</div>
        <div>
          <h1>银行智能客服</h1>
          <p class="header-subtitle">7x24h 在线服务 · 基于RAG多路检索</p>
        </div>
      </div>
      <div class="header-right">
        <button class="btn-icon" id="btnClear" title="清空对话">&#8635;</button>
      </div>
    </header>

    <!-- Chat area -->
    <main class="chat-main" id="chatMain">
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon">&#x1F3E6;</div>
        <h2>欢迎使用银行智能客服</h2>
        <p>我可以为您解答信用卡、贷款、账户、投资、防范诈骗等银行业务问题</p>
        <div class="quick-questions" id="quickQuestions">
          <button class="quick-btn">信用卡年费怎么减免？</button>
          <button class="quick-btn">住房贷款利率是多少？</button>
          <button class="quick-btn">如何防范电信诈骗？</button>
          <button class="quick-btn">账户被冻结了怎么办？</button>
          <button class="quick-btn">信用卡逾期会影响征信吗？</button>
          <button class="quick-btn">个人贷款需要什么条件？</button>
        </div>
      </div>

      <div class="messages-container" id="messagesContainer" style="display:none;">
        <!-- Messages rendered here -->
      </div>
    </main>

    <!-- Status bar -->
    <div class="status-bar" id="statusBar">
      <span class="status-indicator" id="statusIndicator"></span>
      <span class="status-text" id="statusText">就绪</span>
      <span class="status-info" id="statusInfo"></span>
    </div>

    <!-- Input area -->
    <footer class="chat-footer">
      <div class="input-wrapper">
        <textarea
          id="messageInput"
          placeholder="请输入您的问题..."
          rows="1"
          maxlength="1000"
        ></textarea>
        <button class="btn-send" id="btnSend" title="发送 (Ctrl+Enter)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
      <p class="input-hint">按 Ctrl+Enter 发送，Enter 换行</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
